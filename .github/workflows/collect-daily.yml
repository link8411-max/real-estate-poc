name: Daily Collection

on:
  schedule:
    # 하루 3회 (KST 기준)
    - cron: '0 22 * * *'   # KST 07:00 (UTC 22:00 전날)
    - cron: '0 4 * * *'    # KST 13:00
    - cron: '0 10 * * *'   # KST 19:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.11"
      PYTHONUNBUFFERED: "1"
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download database from R2
        run: python r2_utils.py download

      # geocode 가 먼저: 좌표가 새로 붙은 단지도 changed 에 올라 collect 가 함께 내보낸다.
      - name: Geocode new apartments
        run: python -m pipeline.geocode --db real_estate.db --limit 500

      - name: Collect (this + previous month)
        run: python -m pipeline.collect --kind both --daily --changed-out changed_apts.json --summary-out summary.json

      - name: Export changed apartments
        run: python -m pipeline.export_json --db real_estate.db --changed changed_apts.json --out out

      - name: Publish to R2
        run: python -m pipeline.r2_publish --out out --keys out/keys.json

      - name: Sync to Supabase
        run: python -m pipeline.supabase_sync --db real_estate.db --changed changed_apts.json

      - name: Upload database to R2
        run: python r2_utils.py upload

      - name: Record run and push
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          s = json.load(open("summary.json"))
          s["ran_at"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          json.dump({"ran_at": s["ran_at"], "saved": s["saved"], "failed": s["failed_count"]},
                    open("data/last_run.json", "w"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_run.json
          git diff --cached --quiet || git commit -m "chore: daily run"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1
